[package]
name = "virlen-app"
version = "1.1.43"
description = "全能型 AI 智能体桌面客户端 — 多模型、工具调用、视觉识别、skill"
authors = ["wei"]
edition = "2021"
# ⚠️ 保留为**防御性显式声明**（曾经本 package 有两个 bin：GUI `virlen-app` + headless `virlen-cli`）：
#    `cargo run` 与 Tauri CLI 靠 `default-run` 认「主二进制」—— 不加就直接失败：
#    `tauri build` 报 "failed to find main binary, make sure you have a package > default-run"（实测）。
#    现 CLI 已迁出为**独立 package**（见下方 workspace），本 package 只剩 GUI 一个 bin。
default-run = "virlen-app"

# ── workspace ──
# 本 package 同时是 workspace 根；`src-tauri/` 仍是 workspace 根目录，因此 `target/` 与
# `Cargo.lock` 的位置**不变**（CI 里的 bundle 路径无需改）。成员：
# - `virlen-core`：零 `tauri::` 的核心库（引擎 / 持久化 / 沙盒 / 安全 / RAG / 视觉 / 宿主抽象）
# - `virlen-cli`：headless CLI（**命令实现全在其 lib**：`lib.rs` + `config` / `list` / `run` / `tui`），
#   **只依赖 core** → 其二进制里没有 GUI 栈；core 不含任何命令入口
[workspace]
members = ["virlen-core", "virlen-cli"]
resolver = "2"

# 链接器告警静音：MSVC `link.exe` 把「正在创建库 xxx.lib 和对象 xxx.exp」写到 **stdout**，
# rustc 用 `linker_messages` lint 转述 —— 每个 cdylib/staticlib/bin 目标各一条，构建时相当吵。
# 那是工具链的本地化进度提示，不是源码问题；真正的链接错误走 stderr 且是 error，不会被这里掩盖。
# 三个成员统一继承（见各自 Cargo.toml 的 `[lints] workspace = true`）。
[workspace.lints.rust]
linker_messages = "allow"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ai_agent_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# ⚠️ 本 package 只剩**一个 bin**（GUI，由 `src/main.rs` 自动发现，名字取自 package）。
#    `default-run` 保留为防御性显式声明（当初有第二个 bin `virlen-cli` 时，缺它会直接失败：
#    `tauri build` 报 "failed to find main binary, make sure you have a package > default-run"；
#    那条 headless 入口现已迁出为独立 package `virlen-cli`，见下方 workspace）。

[build-dependencies]
tauri-build = { version = "2", features = [] }

# 继承 workspace 的 lint 配置（见上方 `[workspace.lints]`）
[lints]
workspace = true

[dependencies]
# 核心库（零 `tauri::`）：引擎 / 会话与配置持久化 / 沙盒 / 安全判定 / RAG / 视觉 / 宿主抽象。
# 本 package 只提供「GUI 壳」：Tauri 命令、事件出口、托盘、平台集成。
virlen-core = { path = "virlen-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-shell = "2"
regex = "1" # deepseek_tokenizer 的分词正则
once_cell = "1" # 全局惰性初始化
tokio = { version = "1", features = [
    "rt",
    "macros",
    "sync",
    "fs",
    "process",
    "io-util",
    "time",
] }
trash = "5" # move_to_trash（回收站）
image = "0.25" # 剪贴板图片（CF_DIB）
base64 = "0.22" # 视觉命令的 base64 载荷

# ── Windows 平台：WebView2 权限管理（麦克风/摄像头） ──
[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"
notify-rust = "4"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    # 打包（MSIX）身份：GetCurrentPackageFamilyName
    #   —— 打包版发通知要传清单里的 Application Id（见 tray/notify.rs::toast_app_id）
    "Win32_Storage_Packaging_Appx",
    # toast 点击的 COM 激活器（tray/toast_activator.rs）：
    #   INotificationActivationCallback / NOTIFICATION_USER_INPUT_DATA
    #   —— 注意这两个类型在 Win32::UI::Notifications，不在 Win32::UI::Shell
    "Win32_UI_Notifications",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# 进程树管理：Job Object（命令超时/终止时连后代进程一键全杀）+ Toolhelp32 递归枚举
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    # 剪贴板（粘贴文件）：OpenClipboard / GetClipboardData / RegisterClipboardFormatW
    #   - CF_HDROP（资源管理器复制文件）
    #   - code/file-list（VS Code 复制文件，自定义格式）
    "Win32_System_DataExchange",
    # DragQueryFileW / HDROP：把 CF_HDROP 解成真实路径
    "Win32_UI_Shell",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_System_Pipes",
    # GlobalLock / GlobalSize / GlobalUnlock：读自定义剪贴板格式（code/file-list）的原始字节
    "Win32_System_Memory",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
] }

# ── macOS 平台：Apple Speech 框架（SFSpeechRecognizer 离线语音识别） ──
# 仅在 macOS 构建时编译；Windows/Linux 不受影响
# 锁定 0.5.0：0.8.x 的 Swift 桥接引用了 macOS 26 SDK 才有的 API，
# 在旧版 Xcode/SDK 上会编译失败（extra argument 'weight'）
[target.'cfg(target_os = "macos")'.dependencies]
speech = { version = "=0.5.0" }

# ── Linux 平台：Landlock 沙盒（无特权文件系统写隔离）──
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
libc = "0.2"
