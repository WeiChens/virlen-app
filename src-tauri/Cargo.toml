[package]
name = "virlen-app"
version = "1.0.1"
description = "全能型 AI 智能体桌面客户端 — 多模型、工具调用、视觉识别、skill"
authors = ["wei"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ai_agent_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-shell = "2"
walkdir = "2"
ignore = "0.4"
grep = "^0.4.1"
grep-regex = "^0.1.14"
grep-searcher = "^0.1.16"
regex = "1"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
encoding_rs = "0.8"
tokio = { version = "1", features = ["rt", "macros", "sync", "fs", "process", "io-util", "time"] }
trash = "5"
image = "0.25"
base64 = "0.22"

# ── RAG 知识库 ──
# 使用 turbovec（Google TurboQuant 算法）作为向量索引
# 4-bit 量化 + SIMD 搜索，零外部依赖
# 暴力余弦相似度 → 8-16x 压缩 + SIMD 加速
turbovec = "0.9"             # 向量量化索引（2-4 bit, SIMD 搜索）
text-splitter = "0.25"       # 智能文本分块
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
once_cell = "1"              # 全局惰性初始化
rand = { version = "0.8", features = ["small_rng"] }  # 沙盒能力 SID 随机生成
dunce = "1"                  # 路径 canonicalize（Windows UNC/长路径）
reqwest = { version = "0.12", features = ["json", "blocking", "stream"] }
async-trait = "0.1"          # 异步 trait（Provider / ToolExecutor）
zip = "2"                    # ZIP 打包（知识库导出）

# ── 会话持久化 ──
# rusqlite（bundled 内置编译 SQLite，零系统依赖）
# 会话/消息直接落 SQLite，不经过 JS/IndexedDB
rusqlite = { version = "0.32", features = ["bundled"] }
# 文档解析
pdf-extract = "0.7"          # PDF 文本提取

# ── quasivision 全能视觉引擎 ──
# UI 检测、OCR、物体检测(YOLOE-26n)、图标分类
# 内置跨平台 GPU 加速：Windows → DirectML, macOS → CoreML, Linux → CPU
quasivision = "0.2.1"

# ── Windows 平台：WebView2 权限管理（麦克风/摄像头） ──
[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"
# 进程树管理：Job Object（命令超时/终止时连后代进程一键全杀）+ Toolhelp32 递归枚举
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_System_Pipes",
    "Win32_System_Memory",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
] }

# ── macOS 平台：Apple Speech 框架（SFSpeechRecognizer 离线语音识别） ──
# 仅在 macOS 构建时编译；Windows/Linux 不受影响
# 锁定 0.5.0：0.8.x 的 Swift 桥接引用了 macOS 26 SDK 才有的 API，
# 在旧版 Xcode/SDK 上会编译失败（extra argument 'weight'）
[target.'cfg(target_os = "macos")'.dependencies]
speech = { version = "=0.5.0" }

# ── Linux 平台：Landlock 沙盒（无特权文件系统写隔离）──
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
libc = "0.2"
