# =============================================================================
# Virlen Windows Build Workflow
# =============================================================================
# Builds Virlen desktop app for Windows (x86_64) via NSIS installer.
# =============================================================================

name: Build Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 0. 测试门禁 ────────────────────────────────────────────────────────
  # 打 tag 时先跑「tsc + vitest + cargo test」；任一失败则 build 不启动，
  # 从而阻断 release（release 依赖 build）。
  test:
    name: Test (tsc + vitest + cargo)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install frontend dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      # 1) 类型检查 —— 静态门禁（tsconfig：strict，allowImportingTsExtensions）
      - name: TypeScript typecheck (tsc --noEmit)
        shell: bash
        run: npx tsc --noEmit

      # 2) 前端单元测试（vitest run，配置见 vitest.config.ts）
      - name: Frontend tests (vitest)
        shell: bash
        run: pnpm test

      # 3) 构建前端产物：tauri-build 在编译 crate 时要求 frontendDist（../dist）存在
      - name: Build frontend (prerequisite for cargo)
        shell: bash
        run: pnpm build

      # 4) 预建 Cargo 的输出目录 —— **Windows 上这一步是必需的**，不是清理
      # 背景：`quasivision` → `ort-sys` 的 build script 会把预编译包里的 `DirectML.dll`
      # 拷到 `target/<profile>/{,examples,deps}` 三处（ort-sys `build/dynamic_link.rs::copy_dylibs`），
      # 且写的是 `fs::copy(..).unwrap()`。Windows 上没有 Developer Mode 时符号链接会失败，
      # 走 `fs::copy` 回退，而 **`examples/` 目录在仓库里没有任何 example 源码时根本不存在**
      # → `ERROR_PATH_NOT_FOUND`（code 3）→ build script panic：
      #   `ort-sys ... build\dynamic_link.rs:42: called Result::unwrap() on an Err value:
      #    Os { code: 3, kind: NotFound }`
      # ⚠️ 本地永远复现不了：旧构建残留的 `target/debug/examples/`（历史 example 二进制的产物）
      #    把这个 bug 盖住了；CI 是干净 checkout，必然崩。
      # 和它无关的两件事（别被日志带偏）：① 不是缺 DirectML/DX12 库；
      #    ② 不是下载失败 —— `cargo::error=` 那几条打印（下载/解压/hash 不符）一条都没出现。
      # 为什么只在 Windows 发生：三个平台的预编译包里**只有 Windows 包带 `DirectML.dll`**
      # （解压后只有 `onnxruntime.lib` + `DirectML.dll`；Linux/macOS 只发静态库）→ 别的平台
      # 压根不进这个“枚举 .dll/.so/.dylib 并拷贝”的循环。
      - name: Pre-create cargo output dirs (ort-sys copies DirectML.dll into examples/)
        shell: bash
        run: |
          # ort-sys 的 `copy_dylibs(lib_dir, OUT_DIR)` 会用 `OUT_DIR.ancestors().nth(3)` 取基目录，
          # 然后依次往 `<base>`、`<base>/examples`、`<base>/deps` 三个位置拷贝 `DirectML.dll`。
          # Windows 上第 2 个位置（某 profile 目录下的 examples/）在**没有任何 example 源码**时不存在
          # → `fs::copy(..).unwrap()` 返回 `Os { code: 3, kind: NotFound }` → build script panic。
          #
          # 因为 `nth(3)` 的落点随 cargo 的 OUT_DIR 布局而变（本机与 CI 实测不一致），这里**不靠推算**，
          # 直接把 target 下所有可能成为 base 的目录、及其 examples/deps 一次建齐（mkdir -p 幂等，成本近零）。
          for base in \
            target/debug \
            target/debug/build \
            target/release \
            target/release/build \
            target/x86_64-pc-windows-msvc/debug \
            target/x86_64-pc-windows-msvc/debug/build \
            target/x86_64-pc-windows-msvc/release \
            target/x86_64-pc-windows-msvc/release/build; do
            mkdir -p "src-tauri/$base" "src-tauri/$base/examples" "src-tauri/$base/deps"
          done
          # 诊断：把实际建好的目录打出来（万一仍失败，对照日志即可定位真实 base）
          echo "::group::precreated dirs"
          find src-tauri/target -maxdepth 3 -type d \( -name examples -o -name deps \) | sort
          echo "::endgroup::"

      # 5) Rust 测试（各模块内联 #[cfg(test)] mod tests）
      - name: Rust tests (cargo test)
        working-directory: src-tauri
        shell: bash
        run: cargo test --workspace

  build-windows:
    name: Build Windows (x86_64)
    needs: [test]
    runs-on: windows-latest

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Node.js + pnpm ──────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ── 3. Setup Rust ───────────────────────────────────────────────────
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      # ── 3.5 缓存 ONNX Runtime 预编译库（ort-sys）──
      # 这条是**性能**优化，不是修那个 panic 的（修法见 test job 的「Pre-create cargo output dirs」）。
      # 事实：ort-sys 的 build script 要从 `cdn.pyke.io` 拉 `onnxruntime.lib`（305 MB）+
      # `DirectML.dll`（18 MB），解到 `%LOCALAPPDATA%\ort.pyke.io\dfbin\x86_64-pc-windows-msvc\<sha>`。
      # 这个目录**不在 `Swatinem/rust-cache` 的范围内**（它只管 target/ 与 cargo 注册表/索引）
      # → 每次 CI（每个 job）都要重下 300+ MB。缓存后命中就整段跳过。
      - name: Cache ONNX Runtime prebuilt binaries (ort-sys)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ort-pyke-cache
          key: ort-pyke-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ort-pyke-${{ runner.os }}-${{ runner.arch }}-

      # ── 4. Install frontend dependencies ─────────────────────────────────
      - name: Install frontend dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      # ⚠️ 让 ort-sys 用上面缓存的那份预编译库：它认 `ORT_CACHE_DIR`
      #    （见 ort-sys `src/internal/dirs.rs::cache_dir`），其下的 `dfbin/<triple>/<sha>/`
      #    就是展开后的 onnxruntime.lib / DirectML.dll。
      #    ⚠️ 必须经 **`$GITHUB_ENV`** 持久化，不能在命令行写 `ORT_CACHE_DIR=… pnpm run …`：
      #    那是 bash 语法，本 workflow 会走 PowerShell（pwsh 会把它当成外部命令 → 直接失败）。
      - name: Point ort-sys cache at the cached directory
        shell: bash
        run: |
          echo "ORT_CACHE_DIR=$RUNNER_TEMP/ort-pyke-cache" >> "$GITHUB_ENV"
          # 自检：确认预编译库真的就位（不阻断，只提示；缺了就会白下 320MB）
          if compgen -G "$RUNNER_TEMP/ort-pyke-cache/dfbin/*/*/onnxruntime.lib" > /dev/null; then
            echo "::notice::ort-sys 预编译库命中缓存：$(ls -1 "$RUNNER_TEMP"/ort-pyke-cache/dfbin/*/*/ | tr '\n' ' ')"
          else
            echo "::warning::ort-sys 缓存未命中（首次运行或 Cargo.lock 变更）→ 本次仍会从 cdn.pyke.io 下载约 320MB"
          fi

      # ── 5. 预建 Cargo 输出目录（Windows 必需，理由同 test job）──
      # 这里也要建：`CARGO_BUILD_TARGET` 让产物落 `target/<triple>/release/`，而
      # ort-sys 拷 `DirectML.dll` 的目标是 `target/<triple>/release/examples/` ——
      # 仓库里没有任何 example 源码，干净 checkout 不会生成这个目录 → `fs::copy` 报 code 3。
      - name: Pre-create cargo output dirs (ort-sys copies DirectML.dll into examples/)
        shell: bash
        run: |
          # 同 test job：把 target 下所有可能作为 nth(3) base 的目录及其 examples/deps 一次建齐。
          # `CARGO_BUILD_TARGET` 让产物落 target/<triple>/release/，但 debug 侧也一并建上（幂等）。
          for base in \
            target/debug \
            target/debug/build \
            target/release \
            target/release/build \
            target/x86_64-pc-windows-msvc/debug \
            target/x86_64-pc-windows-msvc/debug/build \
            target/x86_64-pc-windows-msvc/release \
            target/x86_64-pc-windows-msvc/release/build; do
            mkdir -p "src-tauri/$base" "src-tauri/$base/examples" "src-tauri/$base/deps"
          done
          echo "::group::precreated dirs"
          find src-tauri/target -maxdepth 4 -type d \( -name examples -o -name deps \) | sort
          echo "::endgroup::"

      # ── 6. Build CLI (virlen-cli) ──
      # headless CLI 与 GUI **同源同 workspace**（共享 Cargo.lock / target/ / rust-cache），
      # 但只依赖 virlen-core → 二进制里没有 tauri / wry / tao / webview2-com。
      # 放在 `cargo install tauri-cli` 之前：CLI 出问题即早退，不必白等那趟编译。
      # ⚠️ CLI 与前端 dist 无关（上面的 `pnpm install` 对它只是顺带复用同一 job）；
      #    三元组显式指定，产物路径必须与下方 artifact / Release 的 glob 一一对齐。
      # ⚠️ 目标三元组用 cargo 原生环境变量 `CARGO_BUILD_TARGET` 传，**不**走 `--target` 参数：
      #    参数得经 `pnpm run` 转发，而 pnpm 对 `--` 的处理随版本/平台不同 —— 本机 pnpm 11.2.2
      #    会把 `--` 剥掉（cargo 收到 `--target`，正常），CI 装的 latest 却会透传
      #    （cargo 收到 `-- --target` → `error: unexpected argument '--target' found`，构建直接失败）。
      #    环境变量不经过任何参数转发，语义与 `--target` 等价（产物同样落 target/<triple>/release/）。
      - name: Build CLI (virlen-cli)
        shell: bash
        env:
          CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
        run: pnpm run build:cli

      # ── 7. Install Tauri CLI ────────────────────────────────────────────
      - name: Install Tauri CLI
        shell: bash
        run: cargo install tauri-cli --version "^2.0"

      # ── 8. Build the app ────────────────────────────────────────────────
      - name: Build Virlen for Windows
        shell: bash
        env:
          # Tauri config for CI
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm tauri build --target x86_64-pc-windows-msvc

      # ── 9. Upload build artifacts ───────────────────────────────────────
      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: Virlen-Windows-x64-${{ github.sha }}
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 14

      - name: Upload MSI installer (if any)
        uses: actions/upload-artifact@v4
        with:
          name: Virlen-Windows-x64-msi-${{ github.sha }}
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 14

      # ── 10. Stage & upload CLI bundle (zip) ──────────────────────────────
      # 产物形态是 **zip 包**，不是裸二进制：裸 exe 不带 `quasivision_models/`，用户在别的
      # 机器上跑 `vision_analyze` 只会拿到「quasivision models directory not found.」。
      # zip 内容：exe + 端侧视觉模型 + DirectML.dll + README.txt（说明文案的唯一源是
      # `.github/cli-bundle-README.txt`，三个平台共用一份）。
      # ⚠️ 三平台共写**同一个 Release**，靠 zip 名区分；zip **内部**文件名可以同名
      #    （Windows 是 `virlen-cli.exe`，Linux / macOS 是 `virlen-cli`）。
      # ⚠️ 文件名不带版本号：版本由 Release tag 承载（与 .exe / .msi 同口径）。
      # ⚠️ **目录布局即契约**：`quasivision_models/` 必须与 exe **同级** —— 这样才命中
      #    `CliHost` 资源候选的最后一档 `<exe_dir>`（`virlen-core/src/host/cli_host.rs`）。
      - name: Stage CLI bundle (binary + vision models → zip)
        shell: pwsh
        run: |
          $stage = "cli-dist/bundle"
          # 幂等：每次从零开始，否则重复执行会把 quasivision_models/ 再套一层（实测踩过）
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$stage/quasivision_models" | Out-Null
          Copy-Item src-tauri/target/x86_64-pc-windows-msvc/release/virlen-cli.exe "$stage/virlen-cli.exe"
          # ⚠️ 必须用 `src/*`（复制内容），不能用 `Copy-Item -Recurse <src> <dst>`：后者在 dst
          #    已存在时会套成 `dst/<src 名>/...` → zip 里出现 `quasivision_models/quasivision_models/`（实测）。
          Copy-Item -Recurse "src-tauri/resources/quasivision_models/*" "$stage/quasivision_models"
          Copy-Item .github/cli-bundle-README.txt "$stage/README.txt"
          # DirectML.dll：onnxruntime 本身是**静态链接**进 exe 的，但 DirectML EP 是 PE 静态导入
          #    → 加载期就要在 exe 同目录里找到它（System32 自带的是 1.0.200713，版本过旧）。
          $dml = "src-tauri/target/x86_64-pc-windows-msvc/release/DirectML.dll"
          if (Test-Path $dml) {
            Copy-Item $dml "$stage/DirectML.dll"
            Write-Host "DirectML.dll ($((Get-Item $dml).VersionInfo.FileVersion)) 已打入"
          } else {
            Write-Host "::warning::$dml 不存在 → zip 不含 DirectML.dll，用户机上 DirectML EP 可能无法初始化"
          }
          Compress-Archive -Path "$stage/*" -DestinationPath cli-dist/virlen-cli-windows-x64.zip -Force
          Write-Host "--- zip 内容 ---"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::OpenRead("cli-dist/virlen-cli-windows-x64.zip").Entries |
            ForEach-Object { "{0,12:N0}  {1}" -f $_.Length, $_.FullName }
          # 自检：就位判据文件必须在 zip 里（.NET 读出的 FullName 用 \ 分隔 → 先归一化），
          # 否则发出去的包在用户机上必然报「quasivision models directory not found.」
          # —— 这种「静默坏包」必须在 CI 里拦住，而不是等用户发现。
          # ⚠️ 程序集在这里**自己**加载，别依赖上面打印内容那段：缺它时 OpenRead 会抛错、
          #    $names 变空 → 报「缺少 xxx」（fail-closed 但容易被误当成真的漏文件）。
          Add-Type -AssemblyName System.IO.Compression.FileSystem | Out-Null
          $z = [System.IO.Compression.ZipFile]::OpenRead("cli-dist/virlen-cli-windows-x64.zip")
          $names = $z.Entries.FullName -replace '\\', '/'
          $z.Dispose()
          foreach ($need in @("virlen-cli.exe", "README.txt", "quasivision_models/ocr-models/ppocrv5_mobile_det.onnx")) {
            if ($names -notcontains $need) { Write-Host "::error::zip 里缺少 $need"; exit 1 }
          }
          # 防嵌套：多套一层时上面那条判据仍会过（第一层原样还在），必须单独拦
          if ($names -match '^quasivision_models/quasivision_models/') {
            Write-Host "::error::zip 里出现嵌套的 quasivision_models/quasivision_models/"; exit 1
          }

      - name: Upload CLI bundle
        uses: actions/upload-artifact@v4
        with:
          name: Virlen-CLI-Windows-x64-${{ github.sha }}
          path: cli-dist/virlen-cli-windows-x64.zip
          # 本轮新增的产物：缺失代表构建/落盘真的出了问题，必须失败（不用 warn）
          if-no-files-found: error
          retention-days: 14

  # ── 11. (Optional) Create Release on tag push ───────────────────────────
  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        shell: bash
        run: |
          find artifacts -type f \( -name "*.exe" -o -name "*.msi" -o -name "virlen-cli-*.zip" \) | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Virlen ${{ github.ref_name }}
          generate_release_notes: true
          # CLI 以 **zip** 发布（内含 quasivision_models / DirectML.dll）→ `**/*.exe` 命中不到，
          # 必须显式列；zip 名带平台后缀，三平台产物在同一个 Release 上不互相覆盖。
          files: |
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/virlen-cli-windows-x64.zip
          fail_on_unmatched_files: false
