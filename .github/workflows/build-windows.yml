# =============================================================================
# Virlen Windows Build Workflow
# =============================================================================
# Builds Virlen desktop app for Windows (x86_64) via NSIS installer.
# =============================================================================

name: Build Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 0. 测试门禁 ────────────────────────────────────────────────────────
  # 打 tag 时先跑「tsc + vitest + cargo test」；任一失败则 build 不启动，
  # 从而阻断 release（release 依赖 build）。
  test:
    name: Test (tsc + vitest + cargo)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install frontend dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      # 1) 类型检查 —— 静态门禁（tsconfig：strict，allowImportingTsExtensions）
      - name: TypeScript typecheck (tsc --noEmit)
        shell: bash
        run: npx tsc --noEmit

      # 2) 前端单元测试（vitest run，配置见 vitest.config.ts）
      - name: Frontend tests (vitest)
        shell: bash
        run: pnpm test

      # 3) 构建前端产物：tauri-build 在编译 crate 时要求 frontendDist（../dist）存在
      - name: Build frontend (prerequisite for cargo)
        shell: bash
        run: pnpm build

      # 4) Rust 测试（各模块内联 #[cfg(test)] mod tests）
      - name: Rust tests (cargo test)
        working-directory: src-tauri
        shell: bash
        run: cargo test --workspace

  build-windows:
    name: Build Windows (x86_64)
    needs: [test]
    runs-on: windows-latest

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Node.js + pnpm ──────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ── 3. Setup Rust ───────────────────────────────────────────────────
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      # ── 4. Install frontend dependencies ─────────────────────────────────
      - name: Install frontend dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      # ── 5. Build CLI (virlen-cli) ──
      # headless CLI 与 GUI **同源同 workspace**（共享 Cargo.lock / target/ / rust-cache），
      # 但只依赖 virlen-core → 二进制里没有 tauri / wry / tao / webview2-com。
      # 放在 `cargo install tauri-cli` 之前：CLI 出问题即早退，不必白等那趟编译。
      # ⚠️ CLI 与前端 dist 无关（上面的 `pnpm install` 对它只是顺带复用同一 job）；
      #    三元组显式指定，产物路径必须与下方 artifact / Release 的 glob 一一对齐。
      # ⚠️ 目标三元组用 cargo 原生环境变量 `CARGO_BUILD_TARGET` 传，**不**走 `--target` 参数：
      #    参数得经 `pnpm run` 转发，而 pnpm 对 `--` 的处理随版本/平台不同 —— 本机 pnpm 11.2.2
      #    会把 `--` 剥掉（cargo 收到 `--target`，正常），CI 装的 latest 却会透传
      #    （cargo 收到 `-- --target` → `error: unexpected argument '--target' found`，构建直接失败）。
      #    环境变量不经过任何参数转发，语义与 `--target` 等价（产物同样落 target/<triple>/release/）。
      - name: Build CLI (virlen-cli)
        shell: bash
        env:
          CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
        run: pnpm run build:cli

      # ── 6. Install Tauri CLI ────────────────────────────────────────────
      - name: Install Tauri CLI
        shell: bash
        run: cargo install tauri-cli --version "^2.0"

      # ── 7. Build the app ────────────────────────────────────────────────
      - name: Build Virlen for Windows
        shell: bash
        env:
          # Tauri config for CI
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm tauri build --target x86_64-pc-windows-msvc

      # ── 8. Upload build artifacts ───────────────────────────────────────
      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: Virlen-Windows-x64-${{ github.sha }}
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 14

      - name: Upload MSI installer (if any)
        uses: actions/upload-artifact@v4
        with:
          name: Virlen-Windows-x64-msi-${{ github.sha }}
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 14

      # ── 9. Stage & upload CLI bundle (zip) ──────────────────────────────
      # 产物形态是 **zip 包**，不是裸二进制：裸 exe 不带 `quasivision_models/`，用户在别的
      # 机器上跑 `vision_analyze` 只会拿到「quasivision models directory not found.」。
      # zip 内容：exe + 端侧视觉模型 + DirectML.dll + README.txt（说明文案的唯一源是
      # `.github/cli-bundle-README.txt`，三个平台共用一份）。
      # ⚠️ 三平台共写**同一个 Release**，靠 zip 名区分；zip **内部**文件名可以同名
      #    （Windows 是 `virlen-cli.exe`，Linux / macOS 是 `virlen-cli`）。
      # ⚠️ 文件名不带版本号：版本由 Release tag 承载（与 .exe / .msi 同口径）。
      # ⚠️ **目录布局即契约**：`quasivision_models/` 必须与 exe **同级** —— 这样才命中
      #    `CliHost` 资源候选的最后一档 `<exe_dir>`（`virlen-core/src/host/cli_host.rs`）。
      - name: Stage CLI bundle (binary + vision models → zip)
        shell: pwsh
        run: |
          $stage = "cli-dist/bundle"
          # 幂等：每次从零开始，否则重复执行会把 quasivision_models/ 再套一层（实测踩过）
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$stage/quasivision_models" | Out-Null
          Copy-Item src-tauri/target/x86_64-pc-windows-msvc/release/virlen-cli.exe "$stage/virlen-cli.exe"
          # ⚠️ 必须用 `src/*`（复制内容），不能用 `Copy-Item -Recurse <src> <dst>`：后者在 dst
          #    已存在时会套成 `dst/<src 名>/...` → zip 里出现 `quasivision_models/quasivision_models/`（实测）。
          Copy-Item -Recurse "src-tauri/resources/quasivision_models/*" "$stage/quasivision_models"
          Copy-Item .github/cli-bundle-README.txt "$stage/README.txt"
          # DirectML.dll：onnxruntime 本身是**静态链接**进 exe 的，但 DirectML EP 是 PE 静态导入
          #    → 加载期就要在 exe 同目录里找到它（System32 自带的是 1.0.200713，版本过旧）。
          $dml = "src-tauri/target/x86_64-pc-windows-msvc/release/DirectML.dll"
          if (Test-Path $dml) {
            Copy-Item $dml "$stage/DirectML.dll"
            Write-Host "DirectML.dll ($((Get-Item $dml).VersionInfo.FileVersion)) 已打入"
          } else {
            Write-Host "::warning::$dml 不存在 → zip 不含 DirectML.dll，用户机上 DirectML EP 可能无法初始化"
          }
          Compress-Archive -Path "$stage/*" -DestinationPath cli-dist/virlen-cli-windows-x64.zip -Force
          Write-Host "--- zip 内容 ---"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::OpenRead("cli-dist/virlen-cli-windows-x64.zip").Entries |
            ForEach-Object { "{0,12:N0}  {1}" -f $_.Length, $_.FullName }
          # 自检：就位判据文件必须在 zip 里（.NET 读出的 FullName 用 \ 分隔 → 先归一化），
          # 否则发出去的包在用户机上必然报「quasivision models directory not found.」
          # —— 这种「静默坏包」必须在 CI 里拦住，而不是等用户发现。
          # ⚠️ 程序集在这里**自己**加载，别依赖上面打印内容那段：缺它时 OpenRead 会抛错、
          #    $names 变空 → 报「缺少 xxx」（fail-closed 但容易被误当成真的漏文件）。
          Add-Type -AssemblyName System.IO.Compression.FileSystem | Out-Null
          $z = [System.IO.Compression.ZipFile]::OpenRead("cli-dist/virlen-cli-windows-x64.zip")
          $names = $z.Entries.FullName -replace '\\', '/'
          $z.Dispose()
          foreach ($need in @("virlen-cli.exe", "README.txt", "quasivision_models/ocr-models/ppocrv5_mobile_det.onnx")) {
            if ($names -notcontains $need) { Write-Host "::error::zip 里缺少 $need"; exit 1 }
          }
          # 防嵌套：多套一层时上面那条判据仍会过（第一层原样还在），必须单独拦
          if ($names -match '^quasivision_models/quasivision_models/') {
            Write-Host "::error::zip 里出现嵌套的 quasivision_models/quasivision_models/"; exit 1
          }

      - name: Upload CLI bundle
        uses: actions/upload-artifact@v4
        with:
          name: Virlen-CLI-Windows-x64-${{ github.sha }}
          path: cli-dist/virlen-cli-windows-x64.zip
          # 本轮新增的产物：缺失代表构建/落盘真的出了问题，必须失败（不用 warn）
          if-no-files-found: error
          retention-days: 14

  # ── 10. (Optional) Create Release on tag push ───────────────────────────
  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        shell: bash
        run: |
          find artifacts -type f \( -name "*.exe" -o -name "*.msi" -o -name "virlen-cli-*.zip" \) | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Virlen ${{ github.ref_name }}
          generate_release_notes: true
          # CLI 以 **zip** 发布（内含 quasivision_models / DirectML.dll）→ `**/*.exe` 命中不到，
          # 必须显式列；zip 名带平台后缀，三平台产物在同一个 Release 上不互相覆盖。
          files: |
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/virlen-cli-windows-x64.zip
          fail_on_unmatched_files: false
