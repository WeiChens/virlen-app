# =============================================================================
# Virlen Linux Build Workflow
# =============================================================================
# Builds Virlen desktop app for Linux (x86_64) as .deb and .AppImage.
# =============================================================================

name: Build Linux

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 0. 测试门禁 ────────────────────────────────────────────────────────
  # 打 tag 时先跑「tsc + vitest + cargo test」；任一失败则 build 不启动，
  # 从而阻断 release（release 依赖 build）。
  test:
    name: Test (tsc + vitest + cargo)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      # cargo test 需要与打包相同的系统依赖（webkit2gtk / openblas 等）
      - name: Install Linux system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libopenblas-dev

      - name: Install frontend dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      # 1) 类型检查 —— 静态门禁
      - name: TypeScript typecheck (tsc --noEmit)
        shell: bash
        run: npx tsc --noEmit

      # 2) 前端单元测试（vitest run）
      - name: Frontend tests (vitest)
        shell: bash
        run: pnpm test

      # 3) 构建前端产物：tauri-build 在编译 crate 时要求 frontendDist（../dist）存在
      - name: Build frontend (prerequisite for cargo)
        shell: bash
        run: pnpm build

      # 4) Rust 测试
      - name: Rust tests (cargo test)
        working-directory: src-tauri
        shell: bash
        run: cargo test --workspace

  build-linux:
    name: Build Linux (x86_64)
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Node.js + pnpm ──────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ── 3. Setup Rust ───────────────────────────────────────────────────
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      # ── 4. Install Linux system dependencies ─────────────────────────
      # Tauri v2 on Linux requires webkit2gtk, libappindicator, etc.
      # Vision engine (quasivision → ort) needs libopenblas for ONNX Runtime
      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libopenblas-dev

      # ── 5. Install frontend dependencies ─────────────────────────────────
      - name: Install frontend dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      # ── 6. Build CLI (virlen-cli) ──
      # headless CLI 与 GUI **同源同 workspace**（共享 Cargo.lock / target/ / rust-cache），
      # 但只依赖 virlen-core → 二进制里没有 tauri / wry / tao / webview2-com。
      # 放在 `cargo install tauri-cli` 之前：CLI 出问题即早退，不必白等那趟编译。
      # ⚠️ CLI 与前端 dist 无关（上面的 `pnpm install` 对它只是顺带复用同一 job）；
      #    三元组显式指定，产物路径必须与下方 artifact / Release 的 glob 一一对齐。
      # ⚠️ 目标三元组用 cargo 原生环境变量 `CARGO_BUILD_TARGET` 传，**不**走 `--target` 参数：
      #    参数得经 `pnpm run` 转发，而 pnpm 对 `--` 的处理随版本/平台不同 —— 本机 pnpm 11.2.2
      #    会把 `--` 剥掉（cargo 收到 `--target`，正常），CI 装的 latest 却会透传
      #    （cargo 收到 `-- --target` → `error: unexpected argument '--target' found`，构建直接失败）。
      #    环境变量不经过任何参数转发，语义与 `--target` 等价（产物同样落 target/<triple>/release/）。
      - name: Build CLI (virlen-cli)
        shell: bash
        env:
          CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
        run: pnpm run build:cli

      # ── 7. Install Tauri CLI ────────────────────────────────────────────
      - name: Install Tauri CLI
        shell: bash
        run: cargo install tauri-cli --version "^2.0"

      # ── 8. Build the app ────────────────────────────────────────────────
      - name: Build Virlen for Linux
        shell: bash
        env:
          # Tauri config for CI
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm tauri build --target x86_64-unknown-linux-gnu

      # ── 9. Upload build artifacts ───────────────────────────────────────
      - name: Upload .deb package
        uses: actions/upload-artifact@v4
        with:
          name: Virlen-Linux-x64-${{ github.sha }}
          path: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
          if-no-files-found: warn
          retention-days: 14

      - name: Upload .AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Virlen-Linux-AppImage-${{ github.sha }}
          path: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
          retention-days: 14

      - name: Upload .rpm package (if any)
        uses: actions/upload-artifact@v4
        with:
          name: Virlen-Linux-rpm-${{ github.sha }}
          path: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
          if-no-files-found: warn
          retention-days: 14

      # ── 10. Stage & upload CLI bundle (zip) ─────────────────────────────
      # 产物形态是 **zip 包**（可执行文件 + `quasivision_models/` + `README.txt`）：裸二进制不带
      # 模型，用户在别的机器上跑 `vision_analyze` 只会拿到「quasivision models directory not found.」。
      # ⚠️ 三平台共写**同一个 Release**，靠 zip 名区分；zip **内部**文件名可以同名。
      # ⚠️ 文件名不带版本号：版本由 Release tag 承载（与 .deb / .AppImage 同口径）。
      # ⚠️ **目录布局即契约**：`quasivision_models/` 必须与可执行文件**同级** —— 这样才命中
      #    `CliHost` 资源候选的最后一档 `<exe_dir>`（`virlen-core/src/host/cli_host.rs`）。
      # ⚠️ 用 `zip`（保留 Unix 可执行位）而不是上裸文件：裸文件在 Artifact 与 Release 上
      #    **不保留 mode**，使用者得自己 `chmod +x`；zip 解压后即可执行。
      - name: Stage CLI bundle (binary + vision models → zip)
        shell: bash
        run: |
          # 幂等：每次从零开始，否则重复执行会把 quasivision_models/ 再套一层（实测踩过）
          rm -rf cli-dist/bundle
          mkdir -p cli-dist/bundle/quasivision_models
          cp src-tauri/target/x86_64-unknown-linux-gnu/release/virlen-cli cli-dist/bundle/virlen-cli
          chmod +x cli-dist/bundle/virlen-cli
          # ⚠️ 用 `src/.`（复制内容），不能用 `cp -r <src> <dst>`：后者在 dst 已存在时
          #    会套成 `dst/<src 名>/...` → zip 里出现 `quasivision_models/quasivision_models/`。
          cp -r src-tauri/resources/quasivision_models/. cli-dist/bundle/quasivision_models/
          cp .github/cli-bundle-README.txt cli-dist/bundle/README.txt
          # 显式列条目（不用 `zip -r out.zip .`）：条目名确定、不带 `./` 前缀
          cd cli-dist/bundle
          zip -r -q ../virlen-cli-linux-x64.zip virlen-cli quasivision_models README.txt
          cd ../..
          unzip -l cli-dist/virlen-cli-linux-x64.zip
          # 自检：就位判据文件必须在 zip 里，否则发出去的包在用户机上必然报
          # 「quasivision models directory not found.」—— 这种「静默坏包」必须在 CI 里拦住。
          for need in virlen-cli README.txt quasivision_models/ocr-models/ppocrv5_mobile_det.onnx; do
            unzip -Z1 cli-dist/virlen-cli-linux-x64.zip | grep -qx "$need" \
              || { echo "::error::zip 里缺少 $need"; exit 1; }
          done
          # 防嵌套：多套一层时上面那条判据仍会过（第一层原样还在），必须单独拦
          if unzip -Z1 cli-dist/virlen-cli-linux-x64.zip | grep -q '^quasivision_models/quasivision_models/'; then
            echo "::error::zip 里出现嵌套的 quasivision_models/quasivision_models/"; exit 1
          fi

      - name: Upload CLI bundle
        uses: actions/upload-artifact@v4
        with:
          name: Virlen-CLI-Linux-x64-${{ github.sha }}
          path: cli-dist/virlen-cli-linux-x64.zip
          # 本轮新增的产物：缺失代表构建/落盘真的出了问题，必须失败（不用 warn）
          if-no-files-found: error
          retention-days: 14

  # ── 11. (Optional) Create Release on tag push ───────────────────────────
  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        shell: bash
        run: |
          find artifacts -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.rpm" -o -name "virlen-cli-*.zip" \) | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Virlen ${{ github.ref_name }}
          generate_release_notes: true
          # CLI 以 **zip** 发布（内含 quasivision_models / README.txt）→ .deb / .AppImage / .rpm
          # 都命中不了，必须显式列；zip 名带平台后缀，三平台产物在同一个 Release 上不互相覆盖。
          # zip 由 Unix `zip` 生成 → **保留可执行位**，解压后直接可跑（无需 chmod +x）。
          files: |
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.rpm
            artifacts/**/virlen-cli-linux-x64.zip
          fail_on_unmatched_files: false
