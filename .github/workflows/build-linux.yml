# =============================================================================
# Virlen Linux Build Workflow
# =============================================================================
# Builds Virlen desktop app for Linux (x86_64) as .deb and .AppImage.
# =============================================================================

name: Build Linux

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 0. 测试门禁 ────────────────────────────────────────────────────────
  # 打 tag 时先跑「tsc + vitest + cargo test」；任一失败则 build 不启动，
  # 从而阻断 release（release 依赖 build）。
  test:
    name: Test (tsc + vitest + cargo)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      # cargo test 需要与打包相同的系统依赖（webkit2gtk / openblas 等）
      - name: Install Linux system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libopenblas-dev

      - name: Install frontend dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      # 1) 类型检查 —— 静态门禁
      - name: TypeScript typecheck (tsc --noEmit)
        shell: bash
        run: npx tsc --noEmit

      # 2) 前端单元测试（vitest run）
      - name: Frontend tests (vitest)
        shell: bash
        run: pnpm test

      # 3) 构建前端产物：tauri-build 在编译 crate 时要求 frontendDist（../dist）存在
      - name: Build frontend (prerequisite for cargo)
        shell: bash
        run: pnpm build

      # 4) Rust 测试
      - name: Rust tests (cargo test)
        working-directory: src-tauri
        shell: bash
        run: cargo test --workspace

  build-linux:
    name: Build Linux (x86_64)
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Node.js + pnpm ──────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ── 3. Setup Rust ───────────────────────────────────────────────────
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      # ── 4. Install Linux system dependencies ─────────────────────────
      # Tauri v2 on Linux requires webkit2gtk, libappindicator, etc.
      # Vision engine (quasivision → ort) needs libopenblas for ONNX Runtime
      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libopenblas-dev

      # ── 5. Install frontend dependencies ─────────────────────────────────
      - name: Install frontend dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      # ── 6. Build CLI (virlen-cli) ──
      # headless CLI 与 GUI **同源同 workspace**（共享 Cargo.lock / target/ / rust-cache），
      # 但只依赖 virlen-core → 二进制里没有 tauri / wry / tao / webview2-com。
      # 放在 `cargo install tauri-cli` 之前：CLI 出问题即早退，不必白等那趟编译。
      # ⚠️ CLI 与前端 dist 无关（上面的 `pnpm install` 对它只是顺带复用同一 job）；
      #    三元组显式指定，产物路径必须与下方 artifact / Release 的 glob 一一对齐。
      # ⚠️ 目标三元组用 cargo 原生环境变量 `CARGO_BUILD_TARGET` 传，**不**走 `--target` 参数：
      #    参数得经 `pnpm run` 转发，而 pnpm 对 `--` 的处理随版本/平台不同 —— 本机 pnpm 11.2.2
      #    会把 `--` 剥掉（cargo 收到 `--target`，正常），CI 装的 latest 却会透传
      #    （cargo 收到 `-- --target` → `error: unexpected argument '--target' found`，构建直接失败）。
      #    环境变量不经过任何参数转发，语义与 `--target` 等价（产物同样落 target/<triple>/release/）。
      - name: Build CLI (virlen-cli)
        shell: bash
        env:
          CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
        run: pnpm run build:cli

      # ── 7. Install Tauri CLI ────────────────────────────────────────────
      - name: Install Tauri CLI
        shell: bash
        run: cargo install tauri-cli --version "^2.0"

      # ── 8. Build the app ────────────────────────────────────────────────
      - name: Build Virlen for Linux
        shell: bash
        env:
          # Tauri config for CI
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm tauri build --target x86_64-unknown-linux-gnu

      # ── 9. Upload build artifacts ───────────────────────────────────────
      - name: Upload .deb package
        uses: actions/upload-artifact@v4
        with:
          name: Virlen-Linux-x64-${{ github.sha }}
          path: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
          if-no-files-found: warn
          retention-days: 14

      - name: Upload .AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Virlen-Linux-AppImage-${{ github.sha }}
          path: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
          retention-days: 14

      - name: Upload .rpm package (if any)
        uses: actions/upload-artifact@v4
        with:
          name: Virlen-Linux-rpm-${{ github.sha }}
          path: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
          if-no-files-found: warn
          retention-days: 14

      # ── 10. Stage & upload CLI binary ───────────────────────────────────
      # 裸二进制形态（不做归档）：CLI 产物同样进 Artifact 与 Release。
      # ⚠️ 必须改成**平台区分名**：三个 build-*.yml 的 release job 会把产物传到**同一个
      #    Release**，而 Linux / macOS 的裸产物 basename 都是 `virlen-cli` → 同名互相覆盖。
      # ⚠️ 文件名不带版本号：版本由 Release tag 承载（与 .deb / .AppImage 同口径）。
      - name: Stage CLI binary (platform-distinct name)
        shell: bash
        run: |
          mkdir -p cli-dist
          cp src-tauri/target/x86_64-unknown-linux-gnu/release/virlen-cli cli-dist/virlen-cli-linux-x64
          chmod +x cli-dist/virlen-cli-linux-x64

      - name: Upload CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: Virlen-CLI-Linux-x64-${{ github.sha }}
          path: cli-dist/virlen-cli-linux-x64
          # 本轮新增的产物：缺失代表构建/落盘真的出了问题，必须失败（不用 warn）
          if-no-files-found: error
          retention-days: 14

  # ── 11. (Optional) Create Release on tag push ───────────────────────────
  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        shell: bash
        run: |
          find artifacts -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.rpm" -o -name "virlen-cli-*" \) | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Virlen ${{ github.ref_name }}
          generate_release_notes: true
          # CLI 裸二进制是**无后缀**文件（.deb / .AppImage / .rpm 都命中不了）→ 必须显式列；
          # 平台后缀让三平台产物在同一个 Release 上不互相覆盖。
          # ⚠️ 裸二进制不带可执行位（upload-artifact 与 Release 资产都不保留 mode）→
          #    使用者下载后需 `chmod +x virlen-cli-linux-x64`。
          files: |
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.rpm
            artifacts/**/virlen-cli-linux-x64
          fail_on_unmatched_files: false
